name: Update PR Wall

on:
  # 每周一 UTC 06:17 自动刷新（避开整点高峰）
  schedule:
    - cron: "17 6 * * 1"
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-wall
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update PR wall in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_pr_wall.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "PR 墙无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: 自动更新开源贡献 PR 墙"
            git push
          fi
